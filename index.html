<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VSD Event Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F1FB; --surface:#FFFFFF; --ink:#211B36; --muted:#6B6580; --line:#E7E3F5;
    --purple:#7C3AED; --purple-dark:#5B21B6; --pink:#EC4899; --blue:#2563EB;
    --red:#EF4444; --amber:#F59E0B; --green:#10B981; --radius:16px;
    --shadow:0 4px 20px rgba(76,29,149,0.08); --brand:linear-gradient(135deg,#7C3AED 0%,#EC4899 100%);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh;}
  header{background:var(--brand); color:#fff; padding:20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; box-shadow:0 4px 24px rgba(124,58,237,.25);}
  header .brand{display:flex; align-items:center; gap:10px;}
  header .brand .dot{width:11px;height:11px;border-radius:50%;background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.25);}
  header h1{font-size:17px; margin:0; font-weight:800;}
  header .sub{font-size:12px; opacity:.85; margin-top:2px;}
  header button{background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); color:#fff; padding:7px 14px; border-radius:10px; font-size:13px; cursor:pointer; font-weight:600;}
  header button:hover{background:rgba(255,255,255,.28);}
  main{max-width:1080px; margin:0 auto; padding:20px 16px 60px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; box-shadow:var(--shadow);}
  .card h2{margin:0 0 4px; font-size:16px; font-weight:800;}
  .card .meta{font-size:12px; color:var(--muted); margin-bottom:12px;}
  label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin:10px 0 4px;}
  input[type=text], input[type=email], input[type=date], textarea, select{
    width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font-size:14px; background:#fff; color:var(--ink); font-family:inherit;
  }
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--purple); box-shadow:0 0 0 3px rgba(124,58,237,.12);}
  textarea{min-height:60px; resize:vertical;}
  .btn{display:inline-block; background:var(--brand); color:#fff; border:none; padding:10px 16px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; margin-top:10px; box-shadow:0 2px 10px rgba(124,58,237,.25); transition:transform .12s ease, box-shadow .12s ease;}
  .btn:hover{transform:translateY(-1px); box-shadow:0 4px 14px rgba(124,58,237,.35);}
  .btn.secondary{background:#fff; color:var(--purple); border:1.5px solid var(--purple); box-shadow:none;}
  .btn.secondary:hover{background:#F5F0FF; transform:none;}
  .btn.small{padding:7px 12px; font-size:12px; margin-top:0;}
  .btn.danger{color:var(--red); border:1.5px solid var(--red); background:#fff; box-shadow:none;}
  .btn.danger:hover{background:#FEF2F2; transform:none;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}
  .checklist-item{border:1.5px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:#fff;}
  .checklist-item.done{border-color:var(--green); background:#ECFDF5;}
  .checklist-item.partial{border-color:var(--amber); background:#FFFBEB;}
  .checklist-item .top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .checklist-item .label{font-size:14px; font-weight:700; flex:1;}
  .status-select{padding:6px 10px; border-radius:20px; border:1.5px solid var(--line); font-size:12px; font-weight:700; background:#fff; cursor:pointer;}
  .status-select.st-done{color:var(--green); border-color:var(--green); background:#ECFDF5;}
  .status-select.st-partial{color:var(--amber); border-color:var(--amber); background:#FFFBEB;}
  .status-select.st-notdone{color:var(--muted); border-color:var(--line); background:#fff;}
  .area-actions{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .edit-form{border-top:1px solid var(--line); margin-top:10px; padding-top:10px;}
  .todo-row{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .todo-row:last-child{border-bottom:none;}
  .todo-row .todo-label{flex:1;}
  .todo-row button{background:none; border:none; cursor:pointer; font-size:12px; padding:2px 6px; font-weight:700;}
  .todo-row .edit-icon{color:var(--purple);}
  .todo-row .del-icon{color:var(--red);}
  .tag-badge{font-size:10px; background:#F1EBFF; color:var(--purple-dark); padding:2px 8px; border-radius:20px; margin-left:6px; font-weight:700;}
  .due-badge{font-size:10px; background:#FEF3C7; color:#92400E; padding:2px 8px; border-radius:20px; margin-left:6px; white-space:nowrap; font-weight:700;}
  .due-badge.overdue{background:#FEE2E2; color:#B91C1C;}
  .photo-preview{max-width:100%; border-radius:10px; margin-top:8px; display:block;}
  .progress-bar{height:8px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:8px;}
  .progress-bar > div{height:100%; background:var(--brand); border-radius:6px; transition:width .4s ease;}
  .grid-table{width:100%; border-collapse:separate; border-spacing:0; font-size:12px; background:#fff; border-radius:12px; overflow:hidden;}
  .grid-table th, .grid-table td{padding:9px 8px; text-align:center; border-bottom:1px solid var(--line);}
  .grid-table th{background:var(--brand); color:#fff; font-size:11px; font-weight:700;}
  .grid-table tr:nth-child(even) td{background:#FAF8FF;}
  .grid-table td.name{text-align:left; font-weight:700;}
  .chip{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:800;}
  .chip.done{background:#D1FAE5; color:#065F46;}
  .chip.partial{background:#FEF3C7; color:#92400E;}
  .chip.notdone{background:#EDEBF7; color:#6B6580;}
  .chip.na{background:transparent; color:#D8D3EE;}
  .muted{color:var(--muted); font-size:13px;}
  .hidden{display:none !important;}
  .tab-bar{display:flex; gap:4px; margin-bottom:16px; background:#fff; border-radius:14px; padding:4px; box-shadow:var(--shadow);}
  .tab-bar button{flex:1; padding:10px; border-radius:10px; border:none; background:transparent; font-size:13px; cursor:pointer; font-weight:700; color:var(--muted); white-space:nowrap;}
  .tab-bar button.active{background:var(--brand); color:#fff; box-shadow:0 2px 8px rgba(124,58,237,.3);}
  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px;}
  .kpi-card{border-radius:16px; padding:16px; color:#fff; box-shadow:var(--shadow);}
  .kpi-card .kpi-icon{font-size:20px; opacity:.9;}
  .kpi-card .kpi-value{font-size:26px; font-weight:800; margin-top:8px; line-height:1;}
  .kpi-card .kpi-label{font-size:11px; opacity:.9; text-transform:uppercase; letter-spacing:.04em; margin-top:4px; font-weight:700;}
  .kpi-card.purple{background:linear-gradient(135deg,#7C3AED,#A78BFA);}
  .kpi-card.blue{background:linear-gradient(135deg,#2563EB,#60A5FA);}
  .kpi-card.green{background:linear-gradient(135deg,#059669,#34D399);}
  .kpi-card.red{background:linear-gradient(135deg,#DC2626,#F87171);}
  .section-heading{display:flex; align-items:baseline; gap:8px; margin:22px 0 12px;}
  .section-heading h2{margin:0; font-size:15px; font-weight:800;}
  .area-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-bottom:8px;}
  .area-grid-card{background:#fff; border:1px solid var(--line); border-top:5px solid var(--line); border-radius:14px; padding:14px; box-shadow:var(--shadow); cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; text-align:left;}
  .area-grid-card:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(76,29,149,.16);}
  .area-grid-top{display:flex; align-items:center; gap:10px;}
  .area-grid-ring{flex-shrink:0; line-height:0;}
  .area-grid-title{flex:1; min-width:0;}
  .area-grid-name{font-weight:800; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .area-grid-temples{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
  .area-grid-footer{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px;}
  .area-grid-count{font-size:11px; color:var(--muted); font-weight:800;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(33,27,54,.55); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; z-index:100; overflow-y:auto;}
  .modal-panel{background:var(--surface); border-radius:20px; max-width:520px; width:100%; padding:22px; position:relative; box-shadow:0 24px 60px rgba(0,0,0,.35); margin:auto;}
  .modal-close{position:absolute; top:14px; right:14px; background:#F5F3FB; border:1px solid var(--line); border-radius:50%; width:32px; height:32px; font-size:14px; cursor:pointer; color:var(--muted);}
  .modal-close:hover{color:var(--red); border-color:var(--red); background:#FEF2F2;}
  .checkbox-row{display:flex; align-items:center; gap:8px; font-weight:500; margin:6px 0; font-size:13px;}
  .checkbox-row input{width:auto;}
  #loginScreen{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; background:var(--brand);}
  #loginScreen .card{width:100%; max-width:360px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .flame{font-size:36px; margin-bottom:6px;}
  .msg{font-size:13px; padding:10px 12px; border-radius:10px; margin-top:10px; font-weight:600;}
  .msg.ok{background:#D1FAE5; color:#065F46;}
  .msg.err{background:#FEE2E2; color:#B91C1C;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="card">
    <div class="flame">🪔</div>
    <h2>VSD Event Dashboard</h2>
    <p class="muted">Enter your email to receive a sign-in link.</p>
    <input type="email" id="loginEmail" placeholder="you@example.com" />
    <button class="btn" style="width:100%" onclick="sendMagicLink()">Send sign-in link</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <div class="dot"></div>
      <div><h1>VSD Event Dashboard</h1><div class="sub" id="whoami"></div></div>
    </div>
    <button onclick="signOut()">Sign out</button>
  </header>
  <main id="mainContent"></main>
</div>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { db: { schema: 'vsd' } });

let currentUser = null;
let isAdmin = false;
let adminActiveEventId = null;
let currentModalAreaId = null;
let peopleDirectory = [];   // global vsd.person cache, for name autocomplete
let modalPeopleList = [];   // this event's incharge+member names, for responsible-person dropdowns

function todayStr(){ return new Date().toISOString().slice(0,10); }

// ---------- VISUAL HELPERS ----------
function bandColor(pct){
  if(pct >= 100) return '#10B981';
  if(pct >= 50) return '#2563EB';
  if(pct > 0) return '#F59E0B';
  return '#EF4444';
}
function ringSvg(pct, size, stroke){
  size = size || 44; stroke = stroke || 4;
  const radius = (size - stroke) / 2;
  const circ = 2 * Math.PI * radius;
  const offset = circ - (pct / 100) * circ;
  const color = bandColor(pct);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="#EDEBF7" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"
        transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="50%" y="50%" text-anchor="middle" dy="0.35em" font-size="${size*0.26}" font-weight="800" fill="${color}" font-family="'Plus Jakarta Sans',sans-serif">${pct}%</text>
    </svg>`;
}
async function getAreaStats(areaId, eventId){
  const { data: items } = await sb.from('checklist_item').select('id')
    .eq('event_id', eventId).or(`area_id.is.null,area_id.eq.${areaId}`);
  const { data: statuses } = await sb.from('area_checklist_status').select('checklist_item_id,status').eq('area_id', areaId);
  const statusMap = {};
  (statuses || []).forEach(s => statusMap[s.checklist_item_id] = s.status);
  let score = 0, doneCount = 0;
  (items || []).forEach(it => {
    const st = statusMap[it.id] || 'Not Done';
    if(st === 'Done'){ score += 1; doneCount += 1; } else if(st === 'Partial') score += 0.5;
  });
  const total = items ? items.length : 0;
  const pct = total ? Math.round((score / total) * 100) : 0;
  return { pct, doneCount, total };
}

// ---------- PEOPLE DIRECTORY (autocomplete) ----------
async function loadPeopleDirectory(){
  const { data } = await sb.from('person').select('full_name,mobile,email').order('full_name');
  peopleDirectory = data || [];
}
function peopleDatalist(id){
  return `<datalist id="${id}">${peopleDirectory.map(p=>`<option value="${p.full_name.replace(/"/g,'&quot;')}">`).join('')}</datalist>`;
}
function autofillFromDirectory(nameInputId, mobileInputId, emailInputId){
  const nameEl = document.getElementById(nameInputId);
  if(!nameEl) return;
  const name = nameEl.value.trim();
  const match = peopleDirectory.find(p => p.full_name.toLowerCase() === name.toLowerCase());
  if(match){
    const mEl = document.getElementById(mobileInputId), eEl = document.getElementById(emailInputId);
    if(mEl && match.mobile && !mEl.value) mEl.value = match.mobile;
    if(eEl && match.email && !eEl.value) eEl.value = match.email;
  }
}
async function upsertPerson(full_name, mobile, email){
  if(!full_name) return;
  const { data: existing } = await sb.from('person').select('id').ilike('full_name', full_name);
  if(existing && existing.length){
    await sb.from('person').update({ mobile: mobile || null, email: email || null }).eq('id', existing[0].id);
  } else {
    await sb.from('person').insert({ full_name, mobile: mobile || null, email: email || null });
  }
}
async function getEventPeopleList(eventId){
  const { data: units } = await sb.from('area').select('id').eq('event_id', eventId);
  const unitIds = (units||[]).map(u=>u.id);
  if(!unitIds.length) return [];
  const { data: assignments } = await sb.from('area_assignment').select('incharge_name,incharge_email').in('area_id', unitIds);
  const { data: members } = await sb.from('unit_member').select('member_name,email').in('area_id', unitIds);
  const list = [];
  (assignments||[]).forEach(a=>list.push({name:a.incharge_name, email:a.incharge_email}));
  (members||[]).forEach(m=>list.push({name:m.member_name, email:m.email}));
  const seen = new Set();
  return list.filter(p=>{
    const key = p.name.toLowerCase();
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

// ---------- AUTH ----------
async function sendMagicLink(){
  const email = document.getElementById('loginEmail').value.trim();
  const msgEl = document.getElementById('loginMsg');
  if(!email){ msgEl.innerHTML = '<div class="msg err">Enter an email address.</div>'; return; }
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
  if(error){ msgEl.innerHTML = `<div class="msg err">${error.message}</div>`; }
  else { msgEl.innerHTML = '<div class="msg ok">Link sent. Check your email (and spam folder) and open it on this device.</div>'; }
}
async function signOut(){ await sb.auth.signOut(); window.location.reload(); }
async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await onLoggedIn(session.user); }
  sb.auth.onAuthStateChange(async (event, session) => {
    if(session && !currentUser){ await onLoggedIn(session.user); }
  });
}
async function onLoggedIn(user){
  currentUser = user;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('whoami').textContent = user.email;
  const { data: adminRow } = await sb.from('admins').select('email').eq('email', user.email).maybeSingle();
  isAdmin = !!adminRow;
  if(isAdmin){ renderAdmin(); } else { renderIncharge(); }
}

// ============================================================
// INCHARGE VIEW (unchanged — works for both Area and Team units)
// ============================================================
async function renderIncharge(){
  const main = document.getElementById('mainContent');
  main.innerHTML = '<p class="muted">Loading your area...</p>';
  const { data: assignments, error } = await sb
    .from('area_assignment')
    .select('id, incharge_name, area:area_id(id, area_name, temple_list, unit_type, event_id, event:event_id(name, event_date))')
    .eq('incharge_email', currentUser.email);

  if(error || !assignments || assignments.length === 0){
    main.innerHTML = '<div class="card"><p class="muted">No area/team is assigned to your email yet. Please check with the admin.</p></div>';
    return;
  }

  main.innerHTML = '';
  for(const a of assignments){
    const { data: members } = await sb.from('unit_member').select('*').eq('area_id', a.area.id).order('sort_order');
    const areaCard = document.createElement('div');
    areaCard.className = 'card';
    areaCard.innerHTML = `
      <h2>${a.area.area_name} <span class="tag-badge">${a.area.unit_type}</span></h2>
      <div class="meta">${a.area.event.name} · ${a.area.event.event_date} · ${a.area.unit_type === 'Area' ? 'Temples' : 'Details'}: ${a.area.temple_list || '-'}</div>
      <div class="meta">Incharge: ${a.incharge_name}${members && members.length ? ' · Team: ' + members.map(m=>m.member_name).join(', ') : ''}</div>
      <div class="progress-bar"><div id="prog-${a.area.id}" style="width:0%"></div></div>
      <div id="checklist-${a.area.id}" style="margin-top:14px;"></div>
    `;
    main.appendChild(areaCard);
    await loadChecklistForArea(a.area.id, a.area.event_id);
  }
}

async function loadChecklistForArea(areaId, eventId){
  const { data: items } = await sb.from('checklist_item').select('*')
    .eq('event_id', eventId).or(`area_id.is.null,area_id.eq.${areaId}`).order('sort_order');
  const { data: statuses } = await sb.from('area_checklist_status').select('*').eq('area_id', areaId);
  const statusMap = {};
  (statuses || []).forEach(s => statusMap[s.checklist_item_id] = s);
  const container = document.getElementById(`checklist-${areaId}`);
  container.innerHTML = '';
  let score = 0;

  (items || []).forEach(item => {
    const st = statusMap[item.id] || { status: 'Not Done', comment: '', photo_url: null };
    if(st.status === 'Done') score += 1; else if(st.status === 'Partial') score += 0.5;
    const rowClass = st.status === 'Done' ? ' done' : (st.status === 'Partial' ? ' partial' : '');
    const selClass = st.status === 'Done' ? 'st-done' : (st.status === 'Partial' ? 'st-partial' : 'st-notdone');
    const overdue = item.due_date && st.status !== 'Done' && item.due_date < todayStr();
    const dueBadge = item.due_date ? `<span class="due-badge${overdue ? ' overdue' : ''}">Due: ${item.due_date}</span>` : '';
    const respBadge = item.responsible_person_name ? `<span class="tag-badge">👤 ${item.responsible_person_name}</span>` : '';
    const div = document.createElement('div');
    div.className = 'checklist-item' + rowClass;
    div.innerHTML = `
      <div class="top">
        <div class="label">${item.label}${item.area_id ? '<span class="tag-badge">this area only</span>' : ''}${dueBadge}${respBadge}</div>
        <select class="status-select ${selClass}" id="status-${areaId}-${item.id}" onchange="this.className='status-select ' + (this.value==='Done'?'st-done':this.value==='Partial'?'st-partial':'st-notdone')">
          <option value="Not Done" ${st.status==='Not Done'?'selected':''}>Not Done</option>
          <option value="Partial" ${st.status==='Partial'?'selected':''}>Partially Done</option>
          <option value="Done" ${st.status==='Done'?'selected':''}>Done</option>
        </select>
      </div>
      <label>Comment</label>
      <textarea id="comment-${areaId}-${item.id}" placeholder="e.g. Waiting for pujari confirmation">${st.comment || ''}</textarea>
      <label>Photo (aangi / activity)</label>
      <input type="file" accept="image/*" id="file-${areaId}-${item.id}" />
      ${st.photo_url ? `<img class="photo-preview" src="${st.photo_url}" />` : ''}
      <div class="row"><button class="btn small" onclick="saveChecklistItem('${areaId}','${item.id}')">Save</button></div>
    `;
    container.appendChild(div);
  });

  const pct = items && items.length ? Math.round((score / items.length) * 100) : 0;
  const bar = document.getElementById(`prog-${areaId}`);
  if(bar) bar.style.width = pct + '%';
}

async function saveChecklistItem(areaId, itemId){
  const status = document.getElementById(`status-${areaId}-${itemId}`).value;
  const comment = document.getElementById(`comment-${areaId}-${itemId}`).value;
  const fileInput = document.getElementById(`file-${areaId}-${itemId}`);
  let photo_url = null;
  if(fileInput.files && fileInput.files[0]){
    const file = fileInput.files[0];
    const path = `${areaId}/${itemId}-${Date.now()}-${file.name}`;
    const { error: upErr } = await sb.storage.from('event-photos').upload(path, file);
    if(!upErr){ const { data: pub } = sb.storage.from('event-photos').getPublicUrl(path); photo_url = pub.publicUrl; }
  }
  const updatePayload = { area_id: areaId, checklist_item_id: itemId, status, comment, updated_by: currentUser.email, updated_at: new Date().toISOString() };
  if(photo_url) updatePayload.photo_url = photo_url;

async function showEventSubTab(tab){

async function renderUnitGrid(unitType){

  gridEl.innerHTML = units.map(a => `

async function addChecklistItem(areaId){
  const inputId = areaId ? `newAreaTodo-${areaId}` : 'newSharedTodo';
  const dueId = areaId ? `newAreaTodoDue-${areaId}` : 'newSharedTodoDue';
  const respId = areaId ? `newAreaTodoResp-${areaId}` : 'newSharedTodoResp';
  const input = document.getElementById(inputId);
  const dueInput = document.getElementById(dueId);
  const respSelect = document.getElementById(respId);
  const label = input.value.trim();
  const due_date = dueInput.value || null;
  const respRaw = respSelect ? respSelect.value : '';
  const [respName, respEmail] = respRaw ? respRaw.split('|') : [null, null];
  if(!label) return;
  const { data: existing } = await sb.from('checklist_item').select('sort_order')
    .eq('event_id', adminActiveEventId).order('sort_order', { ascending: false }).limit(1);
  const nextOrder = existing && existing.length ? existing[0].sort_order + 1 : 0;
  await sb.from('checklist_item').insert({
    event_id: adminActiveEventId, area_id: areaId || null, label, due_date,
    responsible_person_name: respName || null, responsible_person_email: respEmail || null, sort_order: nextOrder
  });
  input.value = ''; dueInput.value = ''; if(respSelect) respSelect.value = '';
  if(areaId) await afterMutation(); else await afterSharedMutation();
}

function showEditTodo(itemId){
  document.getElementById(`todo-view-${itemId}`).classList.add('hidden');
  document.getElementById(`todo-edit-${itemId}`).classList.remove('hidden');
}
function hideEditTodo(itemId){
  document.getElementById(`todo-view-${itemId}`).classList.remove('hidden');
  document.getElementById(`todo-edit-${itemId}`).classList.add('hidden');
}
async function saveTodoEdit(itemId){
  const label = document.getElementById(`todo-edit-label-${itemId}`).value.trim();
  const due_date = document.getElementById(`todo-edit-due-${itemId}`).value || null;
  const respSelect = document.getElementById(`todo-edit-resp-${itemId}`);
  const respRaw = respSelect ? respSelect.value : '';
  const [respName, respEmail] = respRaw ? respRaw.split('|') : [null, null];
  if(!label){ alert('To-do text cannot be empty'); return; }
  const { data: existingItem } = await sb.from('checklist_item').select('area_id').eq('id', itemId).single();
  await sb.from('checklist_item').update({ label, due_date, responsible_person_name: respName || null, responsible_person_email: respEmail || null }).eq('id', itemId);
  if(existingItem && existingItem.area_id) await afterMutation(); else await afterSharedMutation();
}
async function deleteChecklistItem(itemId){
  if(!confirm('Delete this to-do item? Any status/comments recorded against it will also be removed.')) return;
  const { data: existingItem } = await sb.from('checklist_item').select('area_id').eq('id', itemId).single();
  await sb.from('checklist_item').delete().eq('id', itemId);
  if(existingItem && existingItem.area_id) await afterMutation(); else await afterSharedMutation();
}

}
async function saveAssignmentEdit(areaId, assignmentId){
  const incharge_name = document.getElementById(`edit-ic-name-${areaId}`).value.trim();
  const incharge_mobile = document.getElementById(`edit-ic-mobile-${areaId}`).value.trim();
  const incharge_email = document.getElementById(`edit-ic-email-${areaId}`).value.trim();
  if(!incharge_name || !incharge_email){ alert('Enter incharge name and email'); return; }
  const { error } = await sb.from('area_assignment').update({ incharge_name, incharge_email, incharge_mobile }).eq('id', assignmentId);
  if(error){ alert(error.message); return; }
  await upsertPerson(incharge_name, incharge_mobile, incharge_email);
  await afterMutation();
  if(confirm('Details updated. Send a fresh assignment email to the (possibly new) incharge email now?')){
    await sendAssignmentEmail(assignmentId, false);
  }
}
async function sendAssignmentEmail(areaAssignmentId, silent){
  const { data, error } = await sb.functions.invoke('send-notification', { body: { type: 'TEAM_ASSIGNMENT', area_assignment_id: areaAssignmentId } });
  if(error){
    console.error('Email send failed', error);
    if(!silent) alert('Assignment saved, but the email failed to send. Check the Edge Function logs / Resend setup.');
  } else if(!silent){ alert('Assignment email sent.'); }
  return { data, error };
}

// ---------- Shared Tasks tab ----------
async function renderSharedTasksTab(){
  const el = document.getElementById('eventSubTabContent');
  const { data: sharedItems } = await sb.from('checklist_item').select('*').eq('event_id', adminActiveEventId).is('area_id', null).order('sort_order');
  const { data: units } = await sb.from('area').select('id,area_name,unit_type').eq('event_id', adminActiveEventId).order('sort_order');
  modalPeopleList = await getEventPeopleList(adminActiveEventId);

  el.innerHTML = `
    <div class="card">
      <h2>🔗 Applies to every Area &amp; Team automatically</h2>
      <div id="sharedChecklistList">${renderTodoRows(sharedItems || [])}</div>
      <label>Task name</label>
      <input type="text" id="newSharedTodo" placeholder="e.g. Confirm flower quantity with vendor" />
      <label>Due date (optional)</label>
      <input type="date" id="newSharedTodoDue" />
      <label>Responsible person (optional)</label>
      <select id="newSharedTodoResp">
        <option value="">-- none --</option>
        ${modalPeopleList.map(p=>`<option value="${p.name}|${p.email||''}">${p.name}</option>`).join('')}
      </select>
      <button class="btn small" onclick="addChecklistItem(null)">Add (applies to all)</button>
    </div>
    <div class="card">
      <h2>📋 Copy a task to selected Areas / Teams</h2>
      <p class="muted">Creates an independent copy in each one you pick — edit or complete each copy separately afterward.</p>
      <label>Task name</label>
      <input type="text" id="sharedTaskName" placeholder="e.g. Extra flowers for Saturday evening aarti" />
      <label>Due date (optional)</label>
      <input type="date" id="sharedTaskDue" />
      <label>Responsible person (optional)</label>
      <select id="sharedTaskResponsible">
        <option value="">-- none --</option>
        ${modalPeopleList.map(p=>`<option value="${p.name}|${p.email||''}">${p.name}</option>`).join('')}
      </select>
      <label>Copy to</label>
      <div style="margin:6px 0;">
        ${(units||[]).map(u=>`
          <label class="checkbox-row">
            <input type="checkbox" class="sharedTaskUnitCheck" value="${u.id}">
            ${u.area_name} <span class="tag-badge">${u.unit_type}</span>
          </label>
        `).join('') || '<p class="muted">No areas/teams yet.</p>'}
      </div>
      <button class="btn" onclick="createSharedTaskCopies()">Copy task to selected</button>
    </div>
  `;
}

async function createSharedTaskCopies(){
  const label = document.getElementById('sharedTaskName').value.trim();
  const due_date = document.getElementById('sharedTaskDue').value || null;
  const respRaw = document.getElementById('sharedTaskResponsible').value;
  const [respName, respEmail] = respRaw ? respRaw.split('|') : [null, null];
  const checked = Array.from(document.querySelectorAll('.sharedTaskUnitCheck:checked')).map(c=>c.value);
  if(!label){ alert('Enter a task name'); return; }
  if(!checked.length){ alert('Select at least one area/team to copy this task to'); return; }
  const rows = checked.map(unitId => ({
    event_id: adminActiveEventId, area_id: unitId, label, due_date,
    responsible_person_name: respName || null, responsible_person_email: respEmail || null, sort_order: 0
  }));
  await sb.from('checklist_item').insert(rows);
  alert(`Task copied to ${checked.length} ${checked.length===1 ? 'area/team' : 'areas/teams'}.`);
  document.getElementById('sharedTaskName').value = '';
  await renderSharedTasksTab();
}

// ---------- Overview tab ----------
async function renderAdminOverview(){
  const el = document.getElementById('eventSubTabContent');
  if(!adminActiveEventId){ el.innerHTML = '<p class="muted">Select an event first.</p>'; return; }

  const { data: areas } = await sb.from('area').select('*, area_assignment(*)').eq('event_id', adminActiveEventId).order('sort_order');
  const { data: items } = await sb.from('checklist_item').select('*').eq('event_id', adminActiveEventId).order('sort_order');
  const { data: statuses } = await sb.from('area_checklist_status').select('*').in('area_id', (areas||[]).map(a=>a.id));

  const statusMap = {};
  (statuses||[]).forEach(s => statusMap[`${s.area_id}_${s.checklist_item_id}`] = s);

  let totalPctSum = 0, overdueCount = 0;
  const assignedCount = (areas||[]).filter(a => a.area_assignment && a.area_assignment.length).length;

  let rows = '';
  (areas||[]).forEach(a => {
    const inc = a.area_assignment && a.area_assignment[0] ? a.area_assignment[0].incharge_name : '—';
    const applicableItems = (items||[]).filter(it => !it.area_id || it.area_id === a.id);
    let score = 0;
    rows += `<tr><td class="name">${a.area_name} <span class="tag-badge">${a.unit_type}</span></td><td>${inc}</td>`;
    (items||[]).forEach(it => {
      if(it.area_id && it.area_id !== a.id){ rows += `<td><span class="chip na">—</span></td>`; return; }
      const s = statusMap[`${a.id}_${it.id}`];
      const st = s ? s.status : 'Not Done';
      if(st === 'Done') score += 1; else if(st === 'Partial') score += 0.5;
      if(it.due_date && st !== 'Done' && it.due_date < todayStr()) overdueCount++;
      const chipClass = st === 'Done' ? 'done' : (st === 'Partial' ? 'partial' : 'notdone');
      const symbol = st === 'Done' ? '✓' : (st === 'Partial' ? '~' : '·');
      rows += `<td><span class="chip ${chipClass}">${symbol}</span></td>`;
    });
    const pct = applicableItems.length ? Math.round((score / applicableItems.length) * 100) : 0;
    totalPctSum += pct;
    rows += `<td><b style="color:${bandColor(pct)}">${pct}%</b></td></tr>`;
  });

  const overallPct = (areas && areas.length) ? Math.round(totalPctSum / areas.length) : 0;

  el.innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card purple"><div class="kpi-icon">🏛️</div><div class="kpi-value">${(areas||[]).length}</div><div class="kpi-label">Areas + Teams</div></div>
      <div class="kpi-card blue"><div class="kpi-icon">👤</div><div class="kpi-value">${assignedCount}/${(areas||[]).length}</div><div class="kpi-label">Incharges Assigned</div></div>
      <div class="kpi-card green"><div class="kpi-icon">📈</div><div class="kpi-value">${overallPct}%</div><div class="kpi-label">Overall Completion</div></div>
      <div class="kpi-card red"><div class="kpi-icon">⏰</div><div class="kpi-value">${overdueCount}</div><div class="kpi-label">Overdue Items</div></div>
    </div>
    <div class="card">
      <h2>Progress</h2>
      <div style="overflow-x:auto;"><table class="grid-table"><thead><tr><th>Area / Team</th><th>Incharge</th>
      ${(items||[]).map((it,i)=>`<th title="${it.label}${it.area_id ? ' (specific)' : ''}${it.due_date ? ' — due ' + it.due_date : ''}${it.responsible_person_name ? ' — resp: ' + it.responsible_person_name : ''}">#${i+1}${it.area_id ? '*' : ''}</th>`).join('')}
      <th>%</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="muted" style="margin-top:10px;">✓ Done · ~ Partial · · Not Done · * = specific to-do (— means not applicable there)</p>
      <p class="muted">Checklist items: ${(items||[]).map((it,i)=>`#${i+1} ${it.label}${it.due_date ? ' (due ' + it.due_date + ')' : ''}${it.responsible_person_name ? ' [' + it.responsible_person_name + ']' : ''}`).join(' · ')}</p>
    </div>
  `;
}
