<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VSD Event Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F1FB;
    --surface:#FFFFFF;
    --ink:#211B36;
    --muted:#6B6580;
    --line:#E7E3F5;
    --purple:#7C3AED;
    --purple-dark:#5B21B6;
    --pink:#EC4899;
    --blue:#2563EB;
    --red:#EF4444;
    --amber:#F59E0B;
    --green:#10B981;
    --radius:16px;
    --shadow:0 4px 20px rgba(76,29,149,0.08);
    --brand:linear-gradient(135deg,#7C3AED 0%,#EC4899 100%);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
  }
  header{
    background:var(--brand); color:#fff; padding:20px 20px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10;
    box-shadow:0 4px 24px rgba(124,58,237,.25);
  }
  header .brand{display:flex; align-items:center; gap:10px;}
  header .brand .dot{width:11px;height:11px;border-radius:50%;background:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.25);}
  header h1{font-size:17px; margin:0; font-weight:800; letter-spacing:.2px;}
  header .sub{font-size:12px; opacity:.85; margin-top:2px;}
  header button{
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); color:#fff;
    padding:7px 14px; border-radius:10px; font-size:13px; cursor:pointer; font-weight:600;
  }
  header button:hover{background:rgba(255,255,255,.28);}
  main{max-width:1080px; margin:0 auto; padding:20px 16px 60px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .card h2{margin:0 0 4px; font-size:16px; color:var(--ink); font-weight:800;}
  .card .meta{font-size:12px; color:var(--muted); margin-bottom:12px;}
  label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin:10px 0 4px;}
  input[type=text], input[type=email], input[type=date], textarea, select{
    width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px;
    font-size:14px; background:#fff; color:var(--ink); font-family:inherit;
  }
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--purple); box-shadow:0 0 0 3px rgba(124,58,237,.12);}
  textarea{min-height:60px; resize:vertical;}
  .btn{
    display:inline-block; background:var(--brand); color:#fff; border:none;
    padding:10px 16px; border-radius:10px; font-size:14px; font-weight:700;
    cursor:pointer; margin-top:10px; box-shadow:0 2px 10px rgba(124,58,237,.25);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-1px); box-shadow:0 4px 14px rgba(124,58,237,.35);}
  .btn.secondary{background:#fff; color:var(--purple); border:1.5px solid var(--purple); box-shadow:none;}
  .btn.secondary:hover{background:#F5F0FF; transform:none;}
  .btn.small{padding:7px 12px; font-size:12px; margin-top:0;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}
  .checklist-item{
    border:1.5px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:#fff;
  }
  .checklist-item.done{border-color:var(--green); background:#ECFDF5;}
  .checklist-item.partial{border-color:var(--amber); background:#FFFBEB;}
  .checklist-item .top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .checklist-item .label{font-size:14px; font-weight:700; flex:1;}
  .status-select{
    padding:6px 10px; border-radius:20px; border:1.5px solid var(--line); font-size:12px;
    font-weight:700; background:#fff; cursor:pointer;
  }
  .status-select.st-done{color:var(--green); border-color:var(--green); background:#ECFDF5;}
  .status-select.st-partial{color:var(--amber); border-color:var(--amber); background:#FFFBEB;}
  .status-select.st-notdone{color:var(--muted); border-color:var(--line); background:#fff;}
  .btn.danger{color:var(--red); border:1.5px solid var(--red); background:#fff; box-shadow:none;}
  .btn.danger:hover{background:#FEF2F2; transform:none;}
  .area-actions{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .edit-form{border-top:1px solid var(--line); margin-top:10px; padding-top:10px;}
  .todo-row{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .todo-row:last-child{border-bottom:none;}
  .todo-row .todo-label{flex:1;}
  .todo-row button{background:none; border:none; cursor:pointer; font-size:12px; padding:2px 6px; font-weight:700;}
  .todo-row .edit-icon{color:var(--purple);}
  .todo-row .del-icon{color:var(--red);}
  .tag-badge{font-size:10px; background:#F1EBFF; color:var(--purple-dark); padding:2px 8px; border-radius:20px; margin-left:6px; font-weight:700;}
  .due-badge{font-size:10px; background:#FEF3C7; color:#92400E; padding:2px 8px; border-radius:20px; margin-left:6px; white-space:nowrap; font-weight:700;}
  .due-badge.overdue{background:#FEE2E2; color:#B91C1C;}
  .photo-preview{max-width:100%; border-radius:10px; margin-top:8px; display:block;}
  .progress-bar{height:8px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:8px;}
  .progress-bar > div{height:100%; background:var(--brand); border-radius:6px; transition:width .4s ease;}
  .grid-table{width:100%; border-collapse:separate; border-spacing:0; font-size:12px; background:#fff; border-radius:12px; overflow:hidden;}
  .grid-table th, .grid-table td{padding:9px 8px; text-align:center; border-bottom:1px solid var(--line);}
  .grid-table th{background:var(--brand); color:#fff; font-size:11px; font-weight:700;}
  .grid-table tr:nth-child(even) td{background:#FAF8FF;}
  .grid-table td.name{text-align:left; font-weight:700;}
  .chip{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:800;}
  .chip.done{background:#D1FAE5; color:#065F46;}
  .chip.partial{background:#FEF3C7; color:#92400E;}
  .chip.notdone{background:#EDEBF7; color:#6B6580;}
  .chip.na{background:transparent; color:#D8D3EE;}
  .muted{color:var(--muted); font-size:13px;}
  .center{text-align:center;}
  .hidden{display:none !important;}
  .tab-bar{display:flex; gap:4px; margin-bottom:16px; background:#fff; border-radius:14px; padding:4px; box-shadow:var(--shadow); max-width:340px;}
  .tab-bar button{
    flex:1; padding:10px; border-radius:10px; border:none; background:transparent;
    font-size:13px; cursor:pointer; font-weight:700; color:var(--muted);
  }
  .tab-bar button.active{background:var(--brand); color:#fff; box-shadow:0 2px 8px rgba(124,58,237,.3);}
  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px;}
  .kpi-card{border-radius:16px; padding:16px; color:#fff; box-shadow:var(--shadow);}
  .kpi-card .kpi-icon{font-size:20px; opacity:.9;}
  .kpi-card .kpi-value{font-size:26px; font-weight:800; margin-top:8px; line-height:1;}
  .kpi-card .kpi-label{font-size:11px; opacity:.9; text-transform:uppercase; letter-spacing:.04em; margin-top:4px; font-weight:700;}
  .kpi-card.purple{background:linear-gradient(135deg,#7C3AED,#A78BFA);}
  .kpi-card.blue{background:linear-gradient(135deg,#2563EB,#60A5FA);}
  .kpi-card.green{background:linear-gradient(135deg,#059669,#34D399);}
  .kpi-card.red{background:linear-gradient(135deg,#DC2626,#F87171);}

  /* ---------- Area grid (side-by-side summary cards) ---------- */
  .section-heading{display:flex; align-items:baseline; gap:8px; margin:22px 0 12px;}
  .section-heading h2{margin:0; font-size:15px; font-weight:800;}
  .area-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-bottom:8px;}
  .area-grid-card{
    background:#fff; border:1px solid var(--line); border-top:5px solid var(--line);
    border-radius:14px; padding:14px; box-shadow:var(--shadow); cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease; text-align:left;
  }
  .area-grid-card:hover{transform:translateY(-3px); box-shadow:0 10px 26px rgba(76,29,149,.16);}
  .area-grid-top{display:flex; align-items:center; gap:10px;}
  .area-grid-ring{flex-shrink:0; line-height:0;}
  .area-grid-title{flex:1; min-width:0;}
  .area-grid-name{font-weight:800; font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .area-grid-temples{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}
  .area-grid-footer{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px;}
  .area-grid-count{font-size:11px; color:var(--muted); font-weight:800;}

  /* ---------- Modal (area detail / management) ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(33,27,54,.55); backdrop-filter:blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; z-index:100; overflow-y:auto;
  }
  .modal-panel{
    background:var(--surface); border-radius:20px; max-width:520px; width:100%;
    padding:22px; position:relative; box-shadow:0 24px 60px rgba(0,0,0,.35); margin:auto;
  }
  .modal-close{
    position:absolute; top:14px; right:14px; background:#F5F3FB; border:1px solid var(--line);
    border-radius:50%; width:32px; height:32px; font-size:14px; cursor:pointer; color:var(--muted);
  }
  .modal-close:hover{color:var(--red); border-color:var(--red); background:#FEF2F2;}

  #loginScreen{
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;
    background:var(--brand);
  }
  #loginScreen .card{width:100%; max-width:360px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .flame{font-size:36px; margin-bottom:6px;}
  .msg{font-size:13px; padding:10px 12px; border-radius:10px; margin-top:10px; font-weight:600;}
  .msg.ok{background:#D1FAE5; color:#065F46;}
  .msg.err{background:#FEE2E2; color:#B91C1C;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="card">
    <div class="flame">🪔</div>
    <h2>VSD Event Dashboard</h2>
    <p class="muted">Enter your email to receive a sign-in link.</p>
    <input type="email" id="loginEmail" placeholder="you@example.com" />
    <button class="btn" style="width:100%" onclick="sendMagicLink()">Send sign-in link</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <div class="dot"></div>
      <div>
        <h1>VSD Event Dashboard</h1>
        <div class="sub" id="whoami"></div>
      </div>
    </div>
    <button onclick="signOut()">Sign out</button>
  </header>
  <main id="mainContent"></main>
</div>

<script>
// ============================================================
// CONFIG — fill these in after creating your Supabase project
// Dashboard → Project Settings → API
// ============================================================
const SUPABASE_URL = "https://npaikbbvarcsxykmogeo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wYWlrYmJ2YXJjc3h5a21vZ2VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNTcxNzIsImV4cCI6MjA5OTkzMzE3Mn0.zwIfRfHttsYmATkl751GWa1VJE2qUgN5Jxq53tNYSpM";

// Using a custom Postgres schema ("vsd") instead of the default "public".
// It must also be added under Project Settings → API → Exposed schemas (see SETUP.md).
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  db: { schema: 'vsd' }
});

let currentUser = null;
let isAdmin = false;
let currentModalAreaId = null;

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

// ---------- VISUAL HELPERS ----------
function bandColor(pct){
  if(pct >= 100) return '#10B981';
  if(pct >= 50) return '#2563EB';
  if(pct > 0) return '#F59E0B';
  return '#EF4444';
}

function ringSvg(pct, size, stroke){
  size = size || 44; stroke = stroke || 4;
  const radius = (size - stroke) / 2;
  const circ = 2 * Math.PI * radius;
  const offset = circ - (pct / 100) * circ;
  const color = bandColor(pct);
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="#EDEBF7" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round"
        transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="50%" y="50%" text-anchor="middle" dy="0.35em" font-size="${size*0.26}" font-weight="800" fill="${color}" font-family="'Plus Jakarta Sans',sans-serif">${pct}%</text>
    </svg>
  `;
}

async function getAreaStats(areaId, eventId){
  const { data: items } = await sb.from('checklist_item').select('id')
    .eq('event_id', eventId)
    .or(`area_id.is.null,area_id.eq.${areaId}`);
  const { data: statuses } = await sb.from('area_checklist_status').select('checklist_item_id,status').eq('area_id', areaId);
  const statusMap = {};
  (statuses || []).forEach(s => statusMap[s.checklist_item_id] = s.status);
  let score = 0, doneCount = 0;
  (items || []).forEach(it => {
    const st = statusMap[it.id] || 'Not Done';
    if(st === 'Done'){ score += 1; doneCount += 1; }
    else if(st === 'Partial') score += 0.5;
  });
  const total = items ? items.length : 0;
  const pct = total ? Math.round((score / total) * 100) : 0;
  return { pct, doneCount, total };
}

// ---------- AUTH ----------
async function sendMagicLink(){
  const email = document.getElementById('loginEmail').value.trim();
  const msgEl = document.getElementById('loginMsg');
  if(!email){ msgEl.innerHTML = '<div class="msg err">Enter an email address.</div>'; return; }
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.href }
  });
  if(error){
    msgEl.innerHTML = `<div class="msg err">${error.message}</div>`;
  } else {
    msgEl.innerHTML = '<div class="msg ok">Link sent. Check your email (and spam folder) and open it on this device.</div>';
  }
}

async function signOut(){
  await sb.auth.signOut();
  window.location.reload();
}

async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    await onLoggedIn(session.user);
  }
  sb.auth.onAuthStateChange(async (event, session) => {
    if(session && !currentUser){
      await onLoggedIn(session.user);
    }
  });
}

async function onLoggedIn(user){
  currentUser = user;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('whoami').textContent = user.email;

  const { data: adminRow } = await sb.from('admins').select('email').eq('email', user.email).maybeSingle();
  isAdmin = !!adminRow;

  if(isAdmin){ renderAdmin(); } else { renderIncharge(); }
}

// ============================================================
// INCHARGE VIEW
// ============================================================
async function renderIncharge(){
  const main = document.getElementById('mainContent');
  main.innerHTML = '<p class="muted">Loading your area...</p>';

  const { data: assignments, error } = await sb
    .from('area_assignment')
    .select('id, incharge_name, helper_names, area:area_id(id, area_name, temple_list, event_id, event:event_id(name, event_date))')
    .eq('incharge_email', currentUser.email);

  if(error || !assignments || assignments.length === 0){
    main.innerHTML = '<div class="card"><p class="muted">No area is assigned to your email yet. Please check with the admin.</p></div>';
    return;
  }

  main.innerHTML = '';
  for(const a of assignments){
    const areaCard = document.createElement('div');
    areaCard.className = 'card';
    areaCard.innerHTML = `
      <h2>${a.area.area_name}</h2>
      <div class="meta">${a.area.event.name} · ${a.area.event.event_date} · Temples: ${a.area.temple_list || '-'}</div>
      <div class="meta">Incharge: ${a.incharge_name}${a.helper_names ? ' · Helpers: ' + a.helper_names : ''}</div>
      <div class="progress-bar"><div id="prog-${a.area.id}" style="width:0%"></div></div>
      <div id="checklist-${a.area.id}" style="margin-top:14px;"></div>
    `;
    main.appendChild(areaCard);
    await loadChecklistForArea(a.area.id, a.area.event_id);
  }
}

async function loadChecklistForArea(areaId, eventId){
  const { data: items } = await sb.from('checklist_item').select('*')
    .eq('event_id', eventId)
    .or(`area_id.is.null,area_id.eq.${areaId}`)
    .order('sort_order');
  const { data: statuses } = await sb.from('area_checklist_status').select('*').eq('area_id', areaId);

  const statusMap = {};
  (statuses || []).forEach(s => statusMap[s.checklist_item_id] = s);

  const container = document.getElementById(`checklist-${areaId}`);
  container.innerHTML = '';
  let score = 0;

  (items || []).forEach(item => {
    const st = statusMap[item.id] || { status: 'Not Done', comment: '', photo_url: null };
    if(st.status === 'Done') score += 1;
    else if(st.status === 'Partial') score += 0.5;

    const rowClass = st.status === 'Done' ? ' done' : (st.status === 'Partial' ? ' partial' : '');
    const selClass = st.status === 'Done' ? 'st-done' : (st.status === 'Partial' ? 'st-partial' : 'st-notdone');
    const overdue = item.due_date && st.status !== 'Done' && item.due_date < todayStr();
    const dueBadge = item.due_date ? `<span class="due-badge${overdue ? ' overdue' : ''}">Due: ${item.due_date}</span>` : '';

    const div = document.createElement('div');
    div.className = 'checklist-item' + rowClass;
    div.innerHTML = `
      <div class="top">
        <div class="label">${item.label}${item.area_id ? '<span class="tag-badge">this area only</span>' : ''}${dueBadge}</div>
        <select class="status-select ${selClass}" id="status-${areaId}-${item.id}" onchange="this.className='status-select ' + (this.value==='Done'?'st-done':this.value==='Partial'?'st-partial':'st-notdone')">
          <option value="Not Done" ${st.status==='Not Done'?'selected':''}>Not Done</option>
          <option value="Partial" ${st.status==='Partial'?'selected':''}>Partially Done</option>
          <option value="Done" ${st.status==='Done'?'selected':''}>Done</option>
        </select>
      </div>
      <label>Comment</label>
      <textarea id="comment-${areaId}-${item.id}" placeholder="e.g. Waiting for pujari confirmation">${st.comment || ''}</textarea>
      <label>Photo (aangi / activity)</label>
      <input type="file" accept="image/*" id="file-${areaId}-${item.id}" />
      ${st.photo_url ? `<img class="photo-preview" src="${st.photo_url}" />` : ''}
      <div class="row">
        <button class="btn small" onclick="saveChecklistItem('${areaId}','${item.id}')">Save</button>
      </div>
    `;
    container.appendChild(div);
  });

  const pct = items && items.length ? Math.round((score / items.length) * 100) : 0;
  const bar = document.getElementById(`prog-${areaId}`);
  if(bar) bar.style.width = pct + '%';
}

async function saveChecklistItem(areaId, itemId){
  const status = document.getElementById(`status-${areaId}-${itemId}`).value;
  const comment = document.getElementById(`comment-${areaId}-${itemId}`).value;
  const fileInput = document.getElementById(`file-${areaId}-${itemId}`);
  let photo_url = null;

  if(fileInput.files && fileInput.files[0]){
    const file = fileInput.files[0];
    const path = `${areaId}/${itemId}-${Date.now()}-${file.name}`;
    const { error: upErr } = await sb.storage.from('event-photos').upload(path, file);
    if(!upErr){
      const { data: pub } = sb.storage.from('event-photos').getPublicUrl(path);
      photo_url = pub.publicUrl;
    }
  }

  const updatePayload = {
    area_id: areaId,
    checklist_item_id: itemId,
    status,
    comment,
    updated_by: currentUser.email,
    updated_at: new Date().toISOString()
  };
  if(photo_url) updatePayload.photo_url = photo_url;

  await sb.from('area_checklist_status').upsert(updatePayload, { onConflict: 'area_id,checklist_item_id' });

  const { data: areaRow } = await sb.from('area').select('event_id').eq('id', areaId).single();
  await loadChecklistForArea(areaId, areaRow.event_id);
}

// ============================================================
// ADMIN VIEW
// ============================================================
let adminActiveEventId = null;

async function renderAdmin(){
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="tab-bar">
      <button id="tabSetup" class="active" onclick="showAdminTab('setup')">⚙️ Setup</button>
      <button id="tabOverview" onclick="showAdminTab('overview')">📊 Overview</button>
    </div>
    <div id="adminTabContent"></div>
    <div id="areaModalBackdrop" class="modal-backdrop hidden" onclick="closeAreaModalIfBackdrop(event)">
      <div class="modal-panel" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeAreaModal()">✕</button>
        <div id="areaModalContent"></div>
      </div>
    </div>
  `;
  await showAdminTab('setup');
}

async function showAdminTab(tab){
  document.getElementById('tabSetup').classList.toggle('active', tab === 'setup');
  document.getElementById('tabOverview').classList.toggle('active', tab === 'overview');
  if(tab === 'setup') await renderAdminSetup();
  else await renderAdminOverview();
}

async function renderAdminSetup(){
  const el = document.getElementById('adminTabContent');
  const { data: events } = await sb.from('event').select('*').order('created_at', { ascending: false });

  el.innerHTML = `
    <div class="card">
      <h2>📅 Create event</h2>
      <label>Event name</label>
      <input type="text" id="newEventName" placeholder="e.g. Karuna Yatra - Flower Parcel Seva" />
      <label>Event date</label>
      <input type="date" id="newEventDate" />
      <button class="btn" onclick="createNewEvent()">Create event (with default checklist)</button>
    </div>
    <div class="card">
      <h2>🎯 Select event</h2>
      <select id="eventSelect" onchange="onEventSelect(this.value)">
        <option value="">-- choose event --</option>
        ${(events||[]).map(e => `<option value="${e.id}" ${e.id === adminActiveEventId ? 'selected' : ''}>${e.name} (${e.event_date})</option>`).join('')}
      </select>
    </div>
    <div id="areaManagement"></div>
  `;

  if(!adminActiveEventId && events && events.length) adminActiveEventId = events[0].id;
  if(adminActiveEventId) await renderAreaManagement();
}

async function createNewEvent(){
  const name = document.getElementById('newEventName').value.trim();
  const date = document.getElementById('newEventDate').value;
  if(!name || !date){ alert('Enter event name and date'); return; }

  const { data: ev, error } = await sb.from('event').insert({ name, event_date: date }).select().single();
  if(error){ alert(error.message); return; }

  const defaultChecklist = [
    "Inform trustee regarding the event",
    "Sangh na board ma lakhvu (put notice on sangh board)",
    "Sangh na WhatsApp group ma Friday sudhi msg pahochi jay tem karvu",
    "Pujari jode advance ma vat kari levi",
    "Pujari ne kevu — phool chadhya pachi sanje vyavasthit gothvi aangi banavi levi",
    "Aangi no photo/video male toh try karvu",
    "Possible hoy toh sadhu-sadhvi Ms ne mali ne event nu pehla thi jaan kari devu",
    "Dham ni activities nu image avya pachi print kadhi ne Ms sudhi pahochadvu"
  ];
  const rows = defaultChecklist.map((label, i) => ({ event_id: ev.id, label, sort_order: i }));
  await sb.from('checklist_item').insert(rows);

  adminActiveEventId = ev.id;
  await renderAdminSetup();
}

async function onEventSelect(eventId){
  adminActiveEventId = eventId || null;
  closeAreaModal();
  await renderAreaManagement();
}

// ---------- Page-level Setup card (shared checklist, add area, area grid) ----------
async function renderAreaManagement(){
  const el = document.getElementById('areaManagement');
  if(!adminActiveEventId){ el.innerHTML = ''; return; }

  const { data: sharedItems } = await sb.from('checklist_item').select('*').eq('event_id', adminActiveEventId).is('area_id', null).order('sort_order');

  el.innerHTML = `
    <div class="card">
      <h2>📋 Shared checklist <span class="tag-badge">applies to every area</span></h2>
      <div id="sharedChecklistList">${renderTodoRows(sharedItems || [])}</div>
      <label>Add shared to-do</label>
      <div class="row">
        <input type="text" id="newSharedTodo" placeholder="e.g. Confirm flower quantity with vendor" style="flex:2;min-width:160px;" />
        <input type="date" id="newSharedTodoDue" style="flex:1;min-width:130px;" />
        <button class="btn small" onclick="addChecklistItem(null)">Add</button>
      </div>
    </div>
    <div class="card">
      <h2>➕ Add area</h2>
      <label>Area name</label>
      <input type="text" id="newAreaName" placeholder="e.g. Zone 3" />
      <label>Temples in this area</label>
      <textarea id="newAreaTemples" placeholder="e.g. Temple A, Temple B, Temple C"></textarea>
      <button class="btn" onclick="createArea()">Add area</button>
    </div>
    <div class="section-heading">
      <h2>🗺️ All areas</h2>
      <span class="muted">tap a card to manage it</span>
    </div>
    <div class="area-grid" id="areaGridContainer"><p class="muted">Loading...</p></div>
  `;

  await renderAreaGrid();
}

// ---------- Compact side-by-side area cards ----------
async function renderAreaGrid(){
  const gridEl = document.getElementById('areaGridContainer');
  if(!gridEl) return;

  const { data: areas } = await sb.from('area').select('*, area_assignment(*)').eq('event_id', adminActiveEventId).order('sort_order');

  if(!areas || !areas.length){
    gridEl.innerHTML = '<p class="muted">No areas yet — add one above.</p>';
    return;
  }

  gridEl.innerHTML = areas.map(a => `
    <div class="area-grid-card" id="grid-card-${a.id}" onclick="openAreaModal('${a.id}')">
      <div class="area-grid-top">
        <span class="area-grid-ring" id="grid-ring-${a.id}"></span>
        <div class="area-grid-title">
          <div class="area-grid-name">${a.area_name}</div>
          <div class="area-grid-temples">${a.temple_list || 'No temples listed'}</div>
        </div>
      </div>
      <div class="area-grid-footer">
        <span class="area-grid-count" id="grid-count-${a.id}">...</span>
        ${a.area_assignment && a.area_assignment.length ? `
          <span class="chip done" style="background:#EDE9FE;color:#5B21B6;">👤 ${a.area_assignment[0].incharge_name}</span>
        ` : `<span class="chip partial">⚠ Unassigned</span>`}
      </div>
    </div>
  `).join('');

  for(const a of areas){
    const stats = await getAreaStats(a.id, adminActiveEventId);
    const ringEl = document.getElementById(`grid-ring-${a.id}`);
    if(ringEl) ringEl.innerHTML = ringSvg(stats.pct, 46, 5);
    const countEl = document.getElementById(`grid-count-${a.id}`);
    if(countEl) countEl.textContent = `${stats.doneCount}/${stats.total} done`;
    const cardEl = document.getElementById(`grid-card-${a.id}`);
    if(cardEl) cardEl.style.borderTopColor = bandColor(stats.pct);
  }
}

// ---------- Modal: full management for one area ----------
async function openAreaModal(areaId){
  currentModalAreaId = areaId;
  const { data: a } = await sb.from('area').select('*, area_assignment(*)').eq('id', areaId).single();
  const { data: areaItems } = await sb.from('checklist_item').select('*').eq('area_id', areaId).order('sort_order');
  const stats = await getAreaStats(a.id, a.event_id);

  const modalContent = document.getElementById('areaModalContent');
  modalContent.innerHTML = `
    <div id="area-view-${a.id}">
      <div class="area-actions">
        <span class="area-ring">${ringSvg(stats.pct, 46, 5)}</span>
        <h2 style="flex:1;margin:0;">${a.area_name}</h2>
      </div>
      <div class="row">
        <button class="btn small secondary" onclick="showEditArea('${a.id}')">Edit area</button>
        <button class="btn small danger" onclick="deleteArea('${a.id}','${a.area_name.replace(/'/g, "\\'")}')">Delete area</button>
      </div>
      <div class="meta" style="margin-top:10px;">Temples: ${a.temple_list || '-'}</div>
      ${a.area_assignment && a.area_assignment.length ? `
        <div id="assign-view-${a.id}">
          <p class="muted">Incharge: <b>${a.area_assignment[0].incharge_name}</b> (${a.area_assignment[0].incharge_email})${a.area_assignment[0].helper_names ? ' · Helpers: ' + a.area_assignment[0].helper_names : ''}</p>
          <div class="row">
            <button class="btn small secondary" onclick="showEditAssignment('${a.id}')">Edit incharge / team</button>
            <button class="btn small secondary" onclick="sendAssignmentEmail('${a.area_assignment[0].id}', false)">Resend assignment email</button>
          </div>
        </div>
        <div id="assign-edit-${a.id}" class="hidden edit-form">
          <label>Incharge name</label>
          <input type="text" id="edit-ic-name-${a.id}" value="${a.area_assignment[0].incharge_name.replace(/"/g,'&quot;')}" />
          <label>Incharge email</label>
          <input type="email" id="edit-ic-email-${a.id}" value="${a.area_assignment[0].incharge_email.replace(/"/g,'&quot;')}" />
          <label>Helper names</label>
          <input type="text" id="edit-ic-helpers-${a.id}" value="${(a.area_assignment[0].helper_names || '').replace(/"/g,'&quot;')}" placeholder="e.g. Amit, Kunal" />
          <div class="row">
            <button class="btn small" onclick="saveAssignmentEdit('${a.id}','${a.area_assignment[0].id}')">Save</button>
            <button class="btn small secondary" onclick="hideEditAssignment('${a.id}')">Cancel</button>
          </div>
        </div>
      ` : `
        <label>Incharge name</label>
        <input type="text" id="ic-name-${a.id}" placeholder="Full name" />
        <label>Incharge email</label>
        <input type="email" id="ic-email-${a.id}" placeholder="email@example.com" />
        <label>Helper names (optional)</label>
        <input type="text" id="ic-helpers-${a.id}" placeholder="e.g. Amit, Kunal" />
        <button class="btn small" onclick="assignIncharge('${a.id}')">Assign incharge</button>
      `}
      <div id="area-edit-${a.id}" class="hidden edit-form">
        <label>Area name</label>
        <input type="text" id="edit-name-${a.id}" value="${a.area_name.replace(/"/g,'&quot;')}" />
        <label>Temples in this area</label>
        <textarea id="edit-temples-${a.id}">${a.temple_list || ''}</textarea>
        <div class="row">
          <button class="btn small" onclick="saveAreaEdit('${a.id}')">Save</button>
          <button class="btn small secondary" onclick="hideEditArea('${a.id}')">Cancel</button>
        </div>
      </div>
      <div class="edit-form">
        <label style="margin-top:0;">To-do list for this area only</label>
        <div id="areaTodoList-${a.id}">${renderTodoRows(areaItems || [])}</div>
        <div class="row">
          <input type="text" id="newAreaTodo-${a.id}" placeholder="e.g. Extra flowers for this zone's Saturday puja" style="flex:2;min-width:160px;" />
          <input type="date" id="newAreaTodoDue-${a.id}" style="flex:1;min-width:130px;" />
          <button class="btn small" onclick="addChecklistItem('${a.id}')">Add</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('areaModalBackdrop').classList.remove('hidden');
}

function closeAreaModal(){
  currentModalAreaId = null;
  const backdrop = document.getElementById('areaModalBackdrop');
  if(backdrop) backdrop.classList.add('hidden');
}
function closeAreaModalIfBackdrop(e){
  if(e.target.id === 'areaModalBackdrop') closeAreaModal();
}

// Refresh both the grid (summary) and the modal (if one is open) after any change.
async function afterMutation(){
  await renderAreaGrid();
  if(currentModalAreaId){
    await openAreaModal(currentModalAreaId);
  }
}

// Shared checklist changes also need the top "Shared checklist" list refreshed.
async function afterSharedMutation(){
  const { data: sharedItems } = await sb.from('checklist_item').select('*').eq('event_id', adminActiveEventId).is('area_id', null).order('sort_order');
  const listEl = document.getElementById('sharedChecklistList');
  if(listEl) listEl.innerHTML = renderTodoRows(sharedItems || []);
  await afterMutation();
}

function renderTodoRows(items){
  if(!items || !items.length) return '<p class="muted" style="margin:4px 0;">None yet.</p>';
  return items.map(it => `
    <div id="todo-view-${it.id}">
      <div class="todo-row">
        <div class="todo-label">${it.label}${it.due_date ? `<span class="due-badge${it.due_date < todayStr() ? ' overdue' : ''}">Due: ${it.due_date}</span>` : ''}</div>
        <button class="edit-icon" onclick="showEditTodo('${it.id}')">Edit</button>
        <button class="del-icon" onclick="deleteChecklistItem('${it.id}')">Delete</button>
      </div>
    </div>
    <div id="todo-edit-${it.id}" class="hidden edit-form" style="margin-top:0;padding-top:8px;">
      <label style="margin-top:0;">To-do text</label>
      <input type="text" id="todo-edit-label-${it.id}" value="${it.label.replace(/"/g,'&quot;')}" />
      <label>Due date (optional)</label>
      <input type="date" id="todo-edit-due-${it.id}" value="${it.due_date || ''}" />
      <div class="row">
        <button class="btn small" onclick="saveTodoEdit('${it.id}')">Save</button>
        <button class="btn small secondary" onclick="hideEditTodo('${it.id}')">Cancel</button>
      </div>
    </div>
  `).join('');
}

async function addChecklistItem(areaId){
  const inputId = areaId ? `newAreaTodo-${areaId}` : 'newSharedTodo';
  const dueId = areaId ? `newAreaTodoDue-${areaId}` : 'newSharedTodoDue';
  const input = document.getElementById(inputId);
  const dueInput = document.getElementById(dueId);
  const label = input.value.trim();
  const due_date = dueInput.value || null;
  if(!label) return;
  const { data: existing } = await sb.from('checklist_item').select('sort_order')
    .eq('event_id', adminActiveEventId)
    .order('sort_order', { ascending: false }).limit(1);
  const nextOrder = existing && existing.length ? existing[0].sort_order + 1 : 0;
  await sb.from('checklist_item').insert({
    event_id: adminActiveEventId,
    area_id: areaId || null,
    label,
    due_date,
    sort_order: nextOrder
  });
  input.value = '';
  dueInput.value = '';
  if(areaId) await afterMutation(); else await afterSharedMutation();
}

function showEditTodo(itemId){
  document.getElementById(`todo-view-${itemId}`).classList.add('hidden');
  document.getElementById(`todo-edit-${itemId}`).classList.remove('hidden');
}
function hideEditTodo(itemId){
  document.getElementById(`todo-view-${itemId}`).classList.remove('hidden');
  document.getElementById(`todo-edit-${itemId}`).classList.add('hidden');
}

async function saveTodoEdit(itemId){
  const label = document.getElementById(`todo-edit-label-${itemId}`).value.trim();
  const due_date = document.getElementById(`todo-edit-due-${itemId}`).value || null;
  if(!label){ alert('To-do text cannot be empty'); return; }
  const { data: existingItem } = await sb.from('checklist_item').select('area_id').eq('id', itemId).single();
  await sb.from('checklist_item').update({ label, due_date }).eq('id', itemId);
  if(existingItem && existingItem.area_id) await afterMutation(); else await afterSharedMutation();
}

async function deleteChecklistItem(itemId){
  if(!confirm('Delete this to-do item? Any status/comments recorded against it will also be removed.')) return;
  const { data: existingItem } = await sb.from('checklist_item').select('area_id').eq('id', itemId).single();
  await sb.from('checklist_item').delete().eq('id', itemId);
  if(existingItem && existingItem.area_id) await afterMutation(); else await afterSharedMutation();
}

function showEditArea(areaId){
  document.getElementById(`area-view-${areaId}`).classList.add('hidden');
  document.getElementById(`area-edit-${areaId}`).classList.remove('hidden');
}
function hideEditArea(areaId){
  document.getElementById(`area-view-${areaId}`).classList.remove('hidden');
  document.getElementById(`area-edit-${areaId}`).classList.add('hidden');
}

async function saveAreaEdit(areaId){
  const area_name = document.getElementById(`edit-name-${areaId}`).value.trim();
  const temple_list = document.getElementById(`edit-temples-${areaId}`).value.trim();
  if(!area_name){ alert('Area name cannot be empty'); return; }
  await sb.from('area').update({ area_name, temple_list }).eq('id', areaId);
  await afterMutation();
}

async function deleteArea(areaId, areaName){
  if(!confirm(`Delete "${areaName}"? This also removes its incharge assignment, area-specific to-dos, and all recorded status/comments/photos for this area. This cannot be undone.`)) return;
  await sb.from('area').delete().eq('id', areaId);
  if(currentModalAreaId === areaId) closeAreaModal();
  await renderAreaGrid();
}

async function createArea(){
  const area_name = document.getElementById('newAreaName').value.trim();
  const temple_list = document.getElementById('newAreaTemples').value.trim();
  if(!area_name){ alert('Enter area name'); return; }
  await sb.from('area').insert({ event_id: adminActiveEventId, area_name, temple_list });
  await renderAreaGrid();
}

async function assignIncharge(areaId){
  const incharge_name = document.getElementById(`ic-name-${areaId}`).value.trim();
  const incharge_email = document.getElementById(`ic-email-${areaId}`).value.trim();
  const helper_names = document.getElementById(`ic-helpers-${areaId}`).value.trim();
  if(!incharge_name || !incharge_email){ alert('Enter incharge name and email'); return; }
  const { data, error } = await sb.from('area_assignment')
    .insert({ area_id: areaId, incharge_name, incharge_email, helper_names })
    .select().single();
  if(error){ alert(error.message); return; }
  await sendAssignmentEmail(data.id, /*silent*/ false);
  await afterMutation();
}

function showEditAssignment(areaId){
  document.getElementById(`assign-view-${areaId}`).classList.add('hidden');
  document.getElementById(`assign-edit-${areaId}`).classList.remove('hidden');
}
function hideEditAssignment(areaId){
  document.getElementById(`assign-view-${areaId}`).classList.remove('hidden');
  document.getElementById(`assign-edit-${areaId}`).classList.add('hidden');
}

async function saveAssignmentEdit(areaId, assignmentId){
  const incharge_name = document.getElementById(`edit-ic-name-${areaId}`).value.trim();
  const incharge_email = document.getElementById(`edit-ic-email-${areaId}`).value.trim();
  const helper_names = document.getElementById(`edit-ic-helpers-${areaId}`).value.trim();
  if(!incharge_name || !incharge_email){ alert('Enter incharge name and email'); return; }
  const { error } = await sb.from('area_assignment')
    .update({ incharge_name, incharge_email, helper_names })
    .eq('id', assignmentId);
  if(error){ alert(error.message); return; }
  await afterMutation();
  if(confirm('Details updated. Send a fresh assignment email to the (possibly new) incharge email now?')){
    await sendAssignmentEmail(assignmentId, false);
  }
}

async function sendAssignmentEmail(areaAssignmentId, silent){
  const { data, error } = await sb.functions.invoke('send-notification', {
    body: { type: 'TEAM_ASSIGNMENT', area_assignment_id: areaAssignmentId }
  });
  if(error){
    console.error('Email send failed', error);
    if(!silent) alert('Assignment saved, but the email failed to send. Check the Edge Function logs / Resend setup.');
  } else if(!silent){
    alert('Assignment email sent.');
  }
  return { data, error };
}

// ============================================================
// OVERVIEW TAB
// ============================================================
async function renderAdminOverview(){
  const el = document.getElementById('adminTabContent');
  if(!adminActiveEventId){
    el.innerHTML = '<p class="muted">Select an event in the Setup tab first.</p>';
    return;
  }

  const { data: areas } = await sb.from('area').select('*, area_assignment(*)').eq('event_id', adminActiveEventId).order('sort_order');
  const { data: items } = await sb.from('checklist_item').select('*').eq('event_id', adminActiveEventId).order('sort_order');
  const { data: statuses } = await sb.from('area_checklist_status').select('*').in('area_id', (areas||[]).map(a=>a.id));

  const statusMap = {};
  (statuses||[]).forEach(s => statusMap[`${s.area_id}_${s.checklist_item_id}`] = s);

  let totalPctSum = 0;
  let overdueCount = 0;
  const assignedCount = (areas||[]).filter(a => a.area_assignment && a.area_assignment.length).length;

  let rows = '';
  (areas||[]).forEach(a => {
    const inc = a.area_assignment && a.area_assignment[0] ? a.area_assignment[0].incharge_name : '—';
    const applicableItems = (items||[]).filter(it => !it.area_id || it.area_id === a.id);
    let score = 0;
    rows += `<tr><td class="name">${a.area_name}</td><td>${inc}</td>`;
    (items||[]).forEach(it => {
      if(it.area_id && it.area_id !== a.id){
        rows += `<td><span class="chip na">—</span></td>`;
        return;
      }
      const s = statusMap[`${a.id}_${it.id}`];
      const st = s ? s.status : 'Not Done';
      if(st === 'Done') score += 1;
      else if(st === 'Partial') score += 0.5;
      if(it.due_date && st !== 'Done' && it.due_date < todayStr()) overdueCount++;
      const chipClass = st === 'Done' ? 'done' : (st === 'Partial' ? 'partial' : 'notdone');
      const symbol = st === 'Done' ? '✓' : (st === 'Partial' ? '~' : '·');
      rows += `<td><span class="chip ${chipClass}">${symbol}</span></td>`;
    });
    const pct = applicableItems.length ? Math.round((score / applicableItems.length) * 100) : 0;
    totalPctSum += pct;
    rows += `<td><b style="color:${bandColor(pct)}">${pct}%</b></td></tr>`;
  });

  const overallPct = (areas && areas.length) ? Math.round(totalPctSum / areas.length) : 0;

  let html = `
    <div class="kpi-row">
      <div class="kpi-card purple"><div class="kpi-icon">🏛️</div><div class="kpi-value">${(areas||[]).length}</div><div class="kpi-label">Areas</div></div>
      <div class="kpi-card blue"><div class="kpi-icon">👤</div><div class="kpi-value">${assignedCount}/${(areas||[]).length}</div><div class="kpi-label">Incharges Assigned</div></div>
      <div class="kpi-card green"><div class="kpi-icon">📈</div><div class="kpi-value">${overallPct}%</div><div class="kpi-label">Overall Completion</div></div>
      <div class="kpi-card red"><div class="kpi-icon">⏰</div><div class="kpi-value">${overdueCount}</div><div class="kpi-label">Overdue Items</div></div>
    </div>
    <div class="card">
      <h2>Area Progress</h2>
      <div style="overflow-x:auto;"><table class="grid-table"><thead><tr><th>Area</th><th>Incharge</th>
      ${(items||[]).map((it,i)=>`<th title="${it.label}${it.area_id ? ' (area-specific)' : ''}${it.due_date ? ' — due ' + it.due_date : ''}">#${i+1}${it.area_id ? '*' : ''}</th>`).join('')}
      <th>%</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="muted" style="margin-top:10px;">✓ Done · ~ Partial · · Not Done · * = area-specific to-do (— means not applicable to that area)</p>
      <p class="muted">Checklist items: ${(items||[]).map((it,i)=>`#${i+1} ${it.label}${it.due_date ? ' (due ' + it.due_date + ')' : ''}`).join(' · ')}</p>
    </div>
  `;
  el.innerHTML = html;
}

initAuth();
